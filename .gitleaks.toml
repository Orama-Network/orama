# Secret-scan allowlist for `gitleaks dir` / `infisical scan` (the
# TestSecretScan_committedTree gate in e2e/features/scanners).
#
# Every path below was reviewed: none holds a live credential. A finding in a
# path that is not listed fails the gate, so a new fixture is added here by
# name, after looking at it, not by a directory wildcard.

title = "orama secret-scan allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "Test vectors and key fixtures: deterministic keys and signatures that verify code, generated for the tests and worth nothing, Google's published Android key-attestation samples (their verifiedBootKey is a public boot-key hash), and the RFC 8032 Ed25519 vectors upstream cosmwasm-crypto ships"
paths = [
  '''(^|/)chain/native/patches/cosmwasm-crypto/testdata/ed25519_tests\.json$''',
  '''(^|/)chain/client/tx/testdata/tx_vectors\.json$''',
  '''(^|/)chain/x/shielded/wallet/testdata/keys/keys\.json$''',
  '''(^|/)contracts/enrollment/seal\.json$''',
  '''(^|/)sdk/tests/unit/storage/fixtures/ns\.key$''',
  '''(^|/)core/pkg/attest/android/testdata/frankel_sdk37_TEE_EC_2026\.json$''',
  '''(^|/)core/pkg/attest/android/testdata/sony-xperia10-iii_sdk33_TEE_EC\.json$''',
  '''(^|/)core/pkg/attest/android/testdata/tegu_sdk36_SB_EC_2026_ROOT\.json$''',
]

[[allowlists]]
description = "Unit tests: fake keys, tokens and passwords the test itself makes up (an example JWT, a stripe-shaped string, a throwaway P-256 key, a random hex secret, a PEM header with no body)"
paths = [
  '''(^|/)core/cmd/gateway/config_secrets_test\.go$''',
  '''(^|/)core/cmd/orama/internal/audit_commands_test\.go$''',
  '''(^|/)core/cmd/orama/internal/functions/status_errors_test\.go$''',
  '''(^|/)core/cmd/orama/internal/prod_commands_test\.go$''',
  '''(^|/)core/cmd/orama/internal/production/install/remote_args_test\.go$''',
  '''(^|/)core/pkg/config/decode_test\.go$''',
  '''(^|/)core/pkg/deployments/envcodec_bound_test\.go$''',
  '''(^|/)core/pkg/deployments/envcodec_test\.go$''',
  '''(^|/)core/pkg/gateway/handlers/auth/handlers_test\.go$''',
  '''(^|/)core/pkg/gateway/scope_policy_test\.go$''',
  '''(^|/)core/pkg/gateway/handlers/deployments/env_at_rest_test\.go$''',
  '''(^|/)core/pkg/gateway/handlers/operator/authorize_test\.go$''',
  '''(^|/)core/pkg/gateway/handlers/serverless/audit_test\.go$''',
  '''(^|/)core/pkg/gateway/handlers/serverless/caller_key_test\.go$''',
  '''(^|/)core/pkg/gatewayspec/spec_test\.go$''',
  '''(^|/)core/pkg/serverless/engine_ratelimit_test\.go$''',
  '''(^|/)core/pkg/serverless/hostfunctions/device_id_test\.go$''',
  '''(^|/)core/pkg/gateway/internal_auth_test\.go$''',
  '''(^|/)core/pkg/gateway/middleware_apikey_lookup_test\.go$''',
  '''(^|/)core/pkg/gateway/middleware_test\.go$''',
  '''(^|/)core/pkg/gateway/secrets_key_test\.go$''',
  '''(^|/)core/pkg/httputil/auth_test\.go$''',
  '''(^|/)core/pkg/install/global_install_tor_test\.go$''',
  '''(^|/)core/pkg/install/installers/coredns_test\.go$''',
  '''(^|/)core/pkg/install/templates/render_test\.go$''',
  '''(^|/)core/pkg/install/turn_secret_test\.go$''',
  '''(^|/)core/pkg/install/wireguard_test\.go$''',
  '''(^|/)core/pkg/privhelper/wireguard_test\.go$''',
  '''(^|/)core/pkg/push/providers/apns/apns_test\.go$''',
