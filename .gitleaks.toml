[[allowlists]]
description = "Cosmos SDK x/auth parameter names the generic-api-key rule takes for a key (the locked-genesis table pairs each with its stock value); only these two names, only in this file"
condition = "AND"
paths = [
  '''(^|/)chain/app/locked_genesis_test\.go$''',
]
regexes = [
  '''^sig_verify_cost_(ed25519|secp256k1)$''',
]

[[allowlists]]
description = "Public constants and labels that only look like keys: a GPG fingerprint, an HKDF purpose string, a key type name, the names of the files tor keeps its keys in, a doc sentence quoting an HKDF label, the scanner's own pattern for curl -u"
paths = [
  '''(^|/)core/pkg/install/global_install_tor\.go$''',
  '''(^|/)core/pkg/install/installers/tor\.go$''',
  '''(^|/)core/pkg/serverless/hostfunctions/secrets\.go$''',
  '''(^|/)core/pkg/telemetry/report/chain_verify\.go$''',
  '''(^|/)docs/SECURITY\.md$''',
  '''(^|/)docs/whitepaper/technical-reference/vol1/15-inter-node-trust\.md$''',
  '''(^|/)e2e/harness/secrets/patterns\.go$''',
]

# The generic-api-key rule takes the values below for secrets. Each is public and is allowed for its
# own file only (condition = "AND": the path and the value must both match), so a real credential
# added to one of these files is still found. Reviewed with the chain CI gate (bugboard 3381).
[[allowlists]]
description = "create_genesis_test.go: two base64 ed25519 public keys, the bytes 0..31 and 32..63"
condition = "AND"
paths = ['''(^|/)core/cmd/orama/internal/setup/create_genesis_test\.go$''']
regexes = [
  '''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=$''',
  '''^ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=$''',
]

[[allowlists]]
description = "global_netns_test.go: a systemd flag line (--api.enable=true), not a key"
condition = "AND"
paths = ['''(^|/)core/pkg/install/global_netns_test\.go$''']
regexes = ['''^--api\.enable=true$''']

[[allowlists]]
description = "gateway_test.go: the base64 secp256k1 account public key of a REST fixture"
condition = "AND"
paths = ['''(^|/)core/pkg/onchain/gateway_test\.go$''']
regexes = ['''^Ak9OKtmcNNYLm6Yog8lDGoQY\+GcyEpYfl6d7Y3f80Fti[A-Za-z0-9+/=]{0,2}$''']

[[allowlists]]
description = "networks/<name>/genesis.json: base64 collection keys ('lastCodeId', 'lastContractId') of the genesis, which the id_key field name makes look like a secret"
condition = "AND"
paths = ['''(^|/)networks/[a-z0-9-]+/genesis\.json$''']
regexes = [
  '''^BGxhc3RDb2RlSWQ=$''',
  '''^BGxhc3RDb250cmFjdElk$''',
]

