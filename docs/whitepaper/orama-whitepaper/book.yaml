# Orama Whitepaper, Technical Edition: the manifest.
#
# A short, single-volume edition derived from the Technical Reference
# (../technical-reference). It is checked and built by the same tool:
#   make whitepaper-short-check    make whitepaper-short
# See README.md.
#
# version         must equal /VERSION, and so must every chapter's `verified`.
# ownership       false: this book does not own code; the Technical Reference
#                 does. Code anchors (`path:Identifier`) are still checked.
# max_words       per-chapter cap on prose words (the words gate); the book
#                 as a whole is capped by max_words_total.
# output          builds one PDF, dist/orama-whitepaper-v<version>.pdf.
# typst_template  borrowed from the Technical Reference.

title: Orama Whitepaper
subtitle: Technical Edition
version: 0.3.10
ownership: false
max_words_total: 40000
output: orama-whitepaper
typst_template: ../technical-reference/typst/template.typ
# typeset      layout options for this book only (the Technical Reference keeps
#              the template defaults): the 100-page limit includes the title
#              page and the table of contents.
typeset:
  toc_depth: 1
  body_size: 10.5
  margin_inside: 26
  margin_outside: 21
  margin_vertical: 24
  chapter_start: next

volumes:
  - number: 1
    title: Technical Edition
    parts:
      - title: Part I Overview
        chapters:
          - file: ch01-what-orama-is.md
            title: What Orama is
            template: narrative
            verified: "0.3.10"
            max_words: 1500
