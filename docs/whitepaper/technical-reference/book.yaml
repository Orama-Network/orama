# Orama Whitepaper — Technical Reference: the manifest.
#
# This file drives the build (`make whitepaper`) and the gates
# (`make whitepaper-check`, part of `make test`). See README.md.
#
# version   must equal /VERSION. Every chapter's `verified` must equal it too:
#           a release is not done until each chapter has been re-verified
#           against the code at that version and re-stamped.
# owns      path prefixes (directories or files) of tracked code a chapter
#           explains. Every tracked file outside `exclude` must fall under
#           some chapter's `owns`; a new package without an owner fails the
#           gate. Ownership is by the longest matching prefix.
# template  `subsystem` chapters must carry the full section set from
#           STYLE.md; `narrative` chapters only the At-a-glance block.

title: Orama Whitepaper
subtitle: Technical Reference
version: 0.3.11

# Tracked paths that no chapter explains: OramaOS is experimental and out of
# scope, the website and docs are the documentation itself, plans are designs
# that are not code yet.
exclude:
  - os/
  - website/
  - docs/
  - core/tools/whitepaper/
  - plans/
  - secrets/
  - .omc/
  - core/testdata/
  - .gitignore
  - .gitleaks.toml
  - .nvmrc
  - .rules.lock
  - renovate.json
  - CLAUDE.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - LICENSE
  - README.md
  - vault/.gitignore
  - chain/.gitignore
  - vault/README.md

