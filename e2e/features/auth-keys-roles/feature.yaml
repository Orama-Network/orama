# What a credential may do: API keys (format, checksum, 90/365-day life,
# shown once, rotation overlap, resources narrowing a key (what a narrowed key
# may invoke is asserted by auth-capability-ws), revocation reaching exchanged tokens, legacy
# spellings and their Deprecation headers), the owner/admin/developer/
# runtime/reader matrix over representative routes of every policy class,
# key scopes, resource selectors on pubsub, cache and storage (including `..`
# refusal and write-time refusals), odd paths, members add/remove/transfer
# over HTTP and the CLI, app grants and the workload renew route's refusals
# (a workload renewing itself needs a deployed app: reference-apps), and the
# audit trail with its filters, bounds, redaction and --follow, and the
# request log naming the key that made a request.
id: auth-keys-roles
title: API keys, roles, grants, members and the audit trail
area: auth
subtasks: [2828]
stage: 3
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  cli:
    - orama app
    - orama app grants
    - orama app grants list
    - orama app grants set
    - orama audit
    - orama members
    - orama members add
    - orama members list
    - orama members remove
    - orama members transfer
    - orama namespace keys
    - orama namespace keys create
    - orama namespace keys list
    - orama namespace keys revoke
    - orama namespace keys revoke-legacy
    - orama namespace keys rotate
  routes:
    - /v1/audit
    - /v1/auth/renew
    - /v1/auth/token
    - /v1/deployments/grants
    - /v1/namespace/keys
    - /v1/namespace/keys/
    - /v1/namespace/members
    - /v1/namespace/members/
  claims:
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#api-keys: orama_<sk|rk>_<payload>_<checksum>; the key names no namespace; 90 days by default, a year at most; shown once"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#api-keys: rotating keeps the original working for the overlap (7 days by default, 30 at most)"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#api-keys: a key minted with resources (five functions, or a pattern) reports and lists them and a rotation carries them over, over HTTP and the CLI; a resource outside the key's scopes, in an unenforced domain, on an admin key, leaving a scope un-narrowed, or not a selector is refused 400 at mint"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#api-keys: a token exchanged for an admin key lists, mints and revokes keys and lists members; a storage key's token is refused key management with INSUFFICIENT_SCOPE"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#what-a-sign-in-returns: revoking a key stops the key and the tokens exchanged from it"
    - "docs/whitepaper/technical-reference/vol1/12-gateway-architecture.md#credential-resolution: X-API-Key, Authorization: ApiKey and a bare Authorization answer Deprecation: true with what to send instead"
    - "docs/whitepaper/technical-reference/vol1/12-gateway-architecture.md#credential-resolution: a token exchanged from a key never carries the key"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#workload-identity: owner/admin everything, developer the data plane plus db/deploy/secrets/fn:manage, runtime the data plane, reader nothing"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#selectors: INSUFFICIENT_SCOPE names required_scope"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#consistency-and-caching: pubsub topic, cache key and storage name selectors narrow; '..' in a storage name is refused; a cache key is not a path"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#consistency-and-caching: a selector no data path applies (db, push) or that would widen (reader) is refused at write"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#consistency-and-caching: narrowing a wallet's grant lands on its next request"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#workload-identity: ownership is transferred in one step and the outgoing owner keeps admin"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#workloads-get-identity-and-no-grants-by-default: a deployment cannot be granted the control plane; /v1/auth/renew refuses a user session, an exchanged key token, a bare key and no credential (a workload renewing itself is asserted by reference-apps)"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#workloads-get-identity-and-no-grants-by-default: a grant for a name with / or : is 400 and for a deployment that does not exist is 404, and neither is recorded (the grants that succeed are asserted by deployments)"
    - "docs/whitepaper/technical-reference/vol1/14-authorization.md#the-audit-trail: keys, grants and policies are recorded; a key actor is a fingerprint, never the key"
    - "docs/whitepaper/technical-reference/vol1/12-gateway-architecture.md#logging-and-metrics: a request a key makes, bare or exchanged, leaves a request_logs row on the namespace gateway naming the key's id"
    - "docs/whitepaper/technical-reference/appendices/i-api-surface.md#authentication: /v1/audit takes action, principal, since and limit (200 max); the namespace comes from the credential"
