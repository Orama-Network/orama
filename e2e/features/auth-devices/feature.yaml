# Devices and sessions: the RFC 8628 device login (pending, slow_down,
# denied, expired, single collect) approved by a real wallet and by the CLI,
# device enrolment (Ed25519, ES256 raw and DER, thumbprints, dual signatures,
# every key-validation refusal, small-order keys, tombstones), device proofs,
# revocation reaching every public and namespace gateway, sessions listed and
# ended, the optional/required/approval session policy with its sweep,
# exemptions, pending devices, seedless linking and operator recovery, the
# revocation (with the revoker's proof and evidence) every DEVICE_REVOKED carries,
# logging out everywhere from a device-bound session with its proof, the
# DEVICE_REVOKED a revoked device's token, refresh token and WebSocket upgrade
# answer, and token-opened sockets closed with 4403 on every kind of
# revocation (4410 on a device's).
id: auth-devices
title: Device login, device-bound sessions, session policy and socket revocation
area: auth
subtasks: [2827, 2927]
stage: 3
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  cli:
    - orama auth approve
    - orama auth login
    - orama auth sessions
    - orama auth sessions revoke
  routes:
    - /v1/auth/device
    - /v1/auth/device/approve
    - /v1/auth/device/token
    - /v1/auth/devices
    - /v1/auth/devices/
    - /v1/auth/sessions
    - /v1/auth/sessions/
    - /v1/namespace/devices
    - /v1/namespace/devices/
    - /v1/namespace/session-policy
    - /v1/pubsub/ws
    - /v1/auth/logout
  claims:
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#machines-with-no-wallet: pending, slow_down, access_denied, expired after ten minutes; the device code collects a session exactly once"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#machines-with-no-wallet: approving costs a fresh wallet signature; the user code alone is worthless"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#devices: ES256 (raw r||s and DER) and Ed25519 device keys; the device id is the RFC 7638 thumbprint"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#signing-in-with-a-device: a device-bound sign-in is handed no API key; the lobby binds no device"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#signing-in-with-a-device: a revoked device is a tombstone; a small-order Ed25519 key is refused; a key belongs to one account"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#linking-a-device-from-a-device: a device proof is fresh (60s), single use, for one action on one credential; a refused refresh spends nothing"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#device-proofs: a proof outside the window is DEVICE_PROOF_CLOCK_SKEW with the gateway's server_time and Date header; a proof on that clock is accepted and a replay of it refused"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#revoking-a-device: revoking a device ends its tokens on every gateway within ten seconds (403 DEVICE_REVOKED, its refresh token too); the other devices stay signed in"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#sign-in-policy: sessions never return a refresh token; ending one refuses its access tokens within ten seconds"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#linking-a-device-from-a-device: required refuses unbound end users (DEVICE_REQUIRED), sweeps their sign-in keys and exempts owner/admin/developer"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#linking-a-device-from-a-device: approval pends a second device (202) until an active device approves; a wallet cannot approve a device link"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#linking-a-device-from-a-device: seedless linking takes the approver's account; a revoked approver's link cannot be collected (access_denied, never DEVICE_REVOKED to the collecting device)"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#revoking-a-device: from a device-bound session logout all=true needs the device's logout-all proof (DEVICE_PROOF_REQUIRED without, every other session untouched), is good once, and ends every session on every gateway; an unbound session needs none"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#revoking-a-device: a namespace operator lists and revokes an account's devices; the next device enrols as the first"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#revoking-a-device: DEVICE_REVOKED carries the revocation: a device's revoke proof that verifies with the revoker's key for the revoked device and namespace only, the revoker's evidence verbatim; an operator's revocation carries no proof; evidence past 16 KiB revokes nothing"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#revoking-a-device: a revoked device's token is answered DEVICE_REVOKED with the revocation on a request, a function call and a WebSocket upgrade; a revoked session's token stays AUTH_REVOKED"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md#open-websockets: a token-opened socket closes with 4403 within ten seconds of logout or session end, and with 4410 of device revocation; a key-opened socket closes with 4403 when its key is revoked"
