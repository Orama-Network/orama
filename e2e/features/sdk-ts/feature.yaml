# The TypeScript SDK (@orama-network/orama, sdk/src) against the fleet through
# vitest: the SDK's own e2e suite (sdk/tests/e2e) and this feature's
# additions under tests/ (auth verify with a real signature, whoami, refresh
# rotation, refresh-on-401 replay, logout, renew refused for a user, device
# list and device link pending, storage getBinary, db Repository and
# dropTable, functions.invoke not-found, cache multiGet misses and a refusal
# raised rather than answered as misses, the chain read proxy, every key
# profile minted with exactly the SDK's scopes, the workload client (from
# its own entry, reading its token file by default) and its refusals, a
# device-bound session refreshed on a clock ten minutes ahead and behind, a WebSocket closed when its session ends, a PubSubClient with no
# wsURL subscribing on its HTTP client's gateway, network connect and
# disconnect refused to an owner who is not an operator), each vitest test
# reported as a Go subtest. Needs node and pnpm on the runner and sdk/
# installed; without them the package is not applicable (not covered).
id: sdk-ts
title: TypeScript SDK against the fleet
area: clients
subtasks: [2846]
stage: 4
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  routes:
    - /v1/chain/
    - /v1/auth/renew
    - /v1/auth/device
    - /v1/auth/device/token
    - /v1/auth/devices
    - /v1/invoke/
    - /v1/pubsub/ws
    - /v1/namespace/keys
    - /v1/namespace/keys/
    - /v1/network/connect
    - /v1/network/disconnect
  claims:
    - "website/src/docs/developer/sdk-reference.mdx: the SDK's methods work against a live gateway with a namespace session"
    - "website/src/docs/developer/sdk-reference.mdx: createWorkloadClient comes from @orama-network/orama/workload and reads its token file with node:fs/promises by default"
    - "website/src/docs/developer/sdk-reference.mdx#device-bound-sessions: the SDK stamps device proofs on the gateway's clock, so a device-bound session refreshes on a phone whose clock is ten minutes off"
    - "website/src/docs/developer/sdk-reference.mdx: multiGet answers null for a key the cache does not hold and rejects with the SDKError when the request fails"
    - "docs/whitepaper/technical-reference/vol1/13-identity.md: ending a session closes the sockets its tokens hold open within ten seconds"
    - "docs/whitepaper/technical-reference/vol1/36-sdks.md: a pub/sub WebSocket goes to the HttpClient base URL with http replaced by ws unless the PubSubClient was given a wsURL"
    - "docs/whitepaper/technical-reference/appendices/i-api-surface.md: the chain proxy is read-only and refuses every other path"
    - "docs/whitepaper/technical-reference/appendices/i-api-surface.md#network-and-proxy: client.network.connect and disconnect reach the operator-only routes and a non-operator owner is NOT_AN_OPERATOR"
